# Builds, signs and publishes a samar release.
#
# Run it from the Actions tab (works from the GitHub mobile app): "Release" → Run workflow → version, e.g. 1.4.
# Before running:
#   - versionName in app/build.gradle.kts is that version, and versionCode is higher than the last release.
#   - release-notes/v<version>.md exists (the Verify section is added automatically).
# One-time setup of the signing secrets: run scripts/setup-release-secrets.sh on the Mac that has the key (see RELEASING.md).
#
# It refuses to publish if the APK isn't signed with samar's existing key, so a release can never
# break in-app updates for people who already have samar.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 1.4)"
        required: true
        type: string
      draft:
        description: "Create as a draft (not offered to users until you publish it)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # samar's upload certificate. Every release must be signed with it, or updates fail to install.
  EXPECTED_CERT_SHA256: a679719d2b18072ec56303257fe2a53ca83ee16d3f3e68d3c4df9ee5eb6eed23
  BUILD_TOOLS: "37.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # The signing secrets live in this environment, which only main can use.
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version, tag and notes
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Version must look like 1.4"; exit 1; }
          name=$(grep -Po 'versionName = "\K[^"]+' app/build.gradle.kts)
          [[ "$name" == "$VERSION" ]] || { echo "::error::app/build.gradle.kts has versionName $name, not $VERSION"; exit 1; }
          [[ -f "release-notes/$TAG.md" ]] || { echo "::error::Missing release-notes/$TAG.md"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::Release $TAG already exists"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;${{ env.BUILD_TOOLS }}"

      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SAMAR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SAMAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAMAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAMAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] || { echo "::error::Secret SAMAR_$v is not set. See RELEASING.md."; exit 1; }
          done
          # Same place and format the build reads locally (~/samar-keys/upload.properties).
          mkdir -p ~/samar-keys && chmod 700 ~/samar-keys
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/samar-keys/upload.jks
          {
            echo "storeFile=$HOME/samar-keys/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/samar-keys/upload.properties
          chmod 600 ~/samar-keys/*

      - name: Build
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          apk=app/build/outputs/apk/release/app-release.apk
          [[ -f "$apk" ]] || { echo "::error::No signed APK was built (is the key set up?)"; ls app/build/outputs/apk/release; exit 1; }

          # Every signer (v1/v2/v3) must use the one expected certificate.
          cert=$("$bt/apksigner" verify --print-certs "$apk" | grep -Po 'certificate SHA-256 digest: \K[0-9a-f]+' | sort -u | paste -sd' ' || true)
          [[ "$cert" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "::error::APK is signed with $cert, not samar's key. Not publishing: users couldn't update."; exit 1; }

          name=$("$bt/aapt2" dump badging "$apk" | grep -Po "versionName='\K[^']+")
          [[ "$name" == "$VERSION" ]] || { echo "::error::APK says version $name, not $VERSION"; exit 1; }

          # versionCode must be higher than the latest release, or the updater won't offer it.
          code=$("$bt/aapt2" dump badging "$apk" | grep -Po "versionCode='\K[0-9]+")
          prev_tag=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [[ -n "$prev_tag" ]]; then
            gh release download "$prev_tag" --pattern '*.apk' --dir prev
            prev=$("$bt/aapt2" dump badging prev/*.apk | grep -Po "versionCode='\K[0-9]+")
            (( code > prev )) || { echo "::error::versionCode $code is not higher than $prev_tag ($prev)"; exit 1; }
          fi

          cp "$apk" "samar-$VERSION.apk"
          echo "versionCode $code, certificate OK"

      - name: Publish release
        run: |
          set -euo pipefail
          sha=$(sha256sum "samar-$VERSION.apk" | cut -d' ' -f1)
          cert=$(echo "$EXPECTED_CERT_SHA256" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          {
            cat "release-notes/$TAG.md"
            echo
            echo "### Verify"
            echo "- APK SHA-256: \`$sha\`"
            echo "- Signing certificate SHA-256: \`$cert\`"
          } > notes.md
          draft=()
          [[ "${{ inputs.draft }}" == "true" ]] && draft=(--draft)
          gh release create "$TAG" "samar-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "samar $VERSION" --notes-file notes.md --latest "${draft[@]}"
          echo "Released $TAG ($sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -rf ~/samar-keys
